<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0908" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta
      name="description"
      content="VisionDS single-steps your own Python, C++ or Java solution and draws every array, pointer and hash map as it changes — then jumps you to the exact step it went wrong."
    />
    <title>VisionDS — single-step your own code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Stamp the theme before first paint: a stored choice wins, otherwise
         follow the OS. Without this the page paints dark, then flips. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('visionds:theme');
          var light =
            stored === 'daylight' ||
            (!stored && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'daylight' : 'specimen';
        } catch (e) {
          document.documentElement.dataset.theme = 'specimen';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
