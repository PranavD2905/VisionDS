<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VisionDS</title>
    <style>
      :root {
        --bg: #0e1016;
        --panel: #161a24;
        --border: #262c3a;
        --border-strong: #333b4d;
        --text: #e7ebf3;
        --muted: #8b93a7;
        --accent: #7c9cff;
        --accent-line: #3a4a86;
        --danger: #ff7a7a;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 400px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      header .logo {
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      header .logo span { color: var(--accent); }
      header .sub { color: var(--muted); font-size: 11px; margin-left: auto; }
      main { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
      label { display: block; }
      .field-label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 5px;
      }
      textarea, input, select {
        width: 100%;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 12px;
        font-family: inherit;
      }
      textarea { resize: vertical; font-family: var(--mono); }
      textarea:focus, input:focus, select:focus {
        outline: none;
        border-color: var(--accent-line);
      }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      .case {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px;
        background: rgba(255, 255, 255, 0.015);
        position: relative;
      }
      .case + .case { margin-top: 8px; }
      .case .field-label { justify-content: space-between; }
      .case textarea { min-height: 40px; }
      .case-expected { margin-top: 7px; }
      .icon-btn {
        background: transparent;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        padding: 0 4px;
      }
      .icon-btn:hover { color: var(--danger); }
      .ghost-btn {
        background: transparent;
        border: 1px dashed var(--border-strong);
        color: var(--muted);
        border-radius: 8px;
        padding: 7px;
        cursor: pointer;
        font-size: 12px;
        width: 100%;
      }
      .ghost-btn:hover { color: var(--text); border-color: var(--accent-line); }
      footer {
        padding: 12px 14px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .primary-btn {
        background: var(--accent);
        color: #0b0d13;
        border: none;
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { min-height: 15px; font-size: 11px; color: var(--muted); }
      .status.error { color: var(--danger); }
      .problem-title {
        font-weight: 600;
        font-size: 13px;
        margin: 0;
      }
      .problem-title.empty { color: var(--muted); font-weight: 400; }
      details summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 11px;
        list-style: none;
      }
      details summary::-webkit-details-marker { display: none; }
      details[open] summary { margin-bottom: 8px; }
      .code-preview { min-height: 120px; }
      .auth-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.015);
      }
      .auth-row .auth-label {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .auth-row .auth-btn {
        margin-left: auto;
        background: transparent;
        border: 1px solid var(--border-strong);
        color: var(--text);
        border-radius: 7px;
        padding: 5px 10px;
        font-size: 11px;
        cursor: pointer;
        white-space: nowrap;
      }
      .auth-row .auth-btn:hover { border-color: var(--accent-line); }
      .auth-row .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">Vision<span>DS</span></div>
      <div class="sub">LeetCode Import</div>
    </header>

    <div class="auth-row" id="auth-row" hidden>
      <span class="auth-label" id="auth-label">Not signed in</span>
      <button class="auth-btn" id="auth-btn" data-action="signin">Sign in with Google</button>
    </div>

    <main>
      <p class="problem-title empty" id="problem-title">Reading the page…</p>

      <div class="row">
        <label>
          <span class="field-label">Language</span>
          <select id="language">
            <option value="python">Python</option>
            <option value="cpp">C++</option>
            <option value="java">Java (soon)</option>
          </select>
        </label>
      </div>

      <details id="code-details">
        <summary>Show captured code</summary>
        <textarea id="code" class="code-preview" spellcheck="false"></textarea>
      </details>

      <div>
        <div class="field-label">Testcases <span style="text-transform: none; letter-spacing: 0;">— one argument per line</span></div>
        <div id="cases"></div>
        <button class="ghost-btn" id="add-case" style="margin-top: 8px;">+ Add testcase</button>
      </div>
    </main>

    <footer>
      <details>
        <summary>VisionDS site URL</summary>
        <input id="site-url" type="url" placeholder="http://localhost:5173" style="margin-top: 8px;" />
      </details>
      <button class="primary-btn" id="open-btn" disabled>Open in VisionDS</button>
      <div class="status" id="status"></div>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
